<!DOCTYPE html>
<html>
<head>
    <title>Favorite Color</title>
</head>
<body>

    <h1>Enter Your Details</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Favorite Color:</label>
        <input type="text" name="color" required>

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
